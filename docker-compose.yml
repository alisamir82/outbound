# Single-VPS deployment. `docker compose up -d` after copying .env.example to .env.
# Set BASE_PATH=/outbound in .env to serve the app under https://DOMAIN/outbound (leave empty for the root).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}", BASE_PATH: "${BASE_PATH:-}" }
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  web:
    build: { context: ., target: web, args: { BASE_PATH: "${BASE_PATH:-}" } }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
    volumes: [uploads:/app/data/uploads]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000${BASE_PATH:-}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
    volumes: [uploads:/app/data/uploads]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]

volumes:
  uploads:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
